# À placer dans le dépôt sous : .github/workflows/build.yml
# (seul fichier qui ne peut pas être à la racine : GitHub l'exige à cet endroit)
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Organiser les fichiers (le dépôt reste plat, la structure Android est créée ici)
        run: |
          mkdir -p app/src/main/java/bj/sebpay/app
          cp ./*.java app/src/main/java/bj/sebpay/app/
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp app.gradle app/build.gradle

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SebPay-APK
          path: app/build/outputs/apk/debug/*.apk
